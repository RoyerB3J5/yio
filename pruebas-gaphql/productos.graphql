query GetFraganciaHombre {
  collectionByHandle(handle: "men-fragances") {
    title
    products(first: 20) {
      nodes {
        id
        handle
        title
        vendor
        createdAt
        tags
        featuredImage {
          url
          altText
        }
        priceRange {
          minVariantPrice {
            amount
            currencyCode
          }
        }
        volumen: metafield(namespace: "fragancia", key: "volumen") {
          value
        }
      }
    }
  }
}

